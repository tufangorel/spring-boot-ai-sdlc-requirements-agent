spring.application.name=spring-boot-ai-sdlc-requirements-agent

# Chat model provider used for generation: openai or anthropic
spring.ai.model.chat=${AI_PROVIDER:openai}

# Only chat is used, so the other model auto-configurations stay off
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
spring.ai.anthropic.chat.options.temperature=0.2
spring.ai.anthropic.chat.options.max-tokens=4096

management.endpoints.web.exposure.include=health,info

server.error.include-message=always
server.error.include-binding-errors=always

requirements.max-requirement-characters=20000
requirements.max-context-characters=4000
requirements.max-stories=10
requirements.definition-of-done[0]=Code is peer reviewed and merged to the main branch
requirements.definition-of-done[1]=Every acceptance criterion is covered by an automated test that passes in CI
requirements.definition-of-done[2]=No open critical or major defects remain for the story
requirements.definition-of-done[3]=User-facing and API documentation is updated
requirements.definition-of-done[4]=The product owner has accepted the story
